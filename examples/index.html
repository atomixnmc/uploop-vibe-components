<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Uploop Vibe — AI-First Components</title>
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
            }
            body {
                font-family:
                    "Inter",
                    "Segoe UI",
                    system-ui,
                    -apple-system,
                    sans-serif;
                background: #f8f9fa;
                color: #212529;
                -webkit-font-smoothing: antialiased;
            }
        </style>
    </head>
    <body>
        <div id="app"></div>
        <script type="module">
            import { html, component } from "@uploop/html";
            import { vibeLight, applyVibeTheme } from "@uploop-vibe/vibe";

            applyVibeTheme(vibeLight);

            const Landing = component("VibeLanding", {
                state: {},
                view: () => html`
                    <div
                        style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;"
                    >
                        <div style="font-size:4rem;margin-bottom:1rem;">⚡</div>
                        <h1
                            style="font-size:2.5rem;font-weight:800;margin:0 0 0.5rem;"
                        >
                            Uploop Vibe
                        </h1>
                        <p
                            style="font-size:1.1rem;color:#666;max-width:520px;margin:0 auto 2rem;line-height:1.6;"
                        >
                            AI-first design components built on the
                            <strong>HyperGraph</strong> architecture. Describe
                            what you want — Vibe materializes it.
                        </p>

                        <div
                            style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;max-width:800px;width:100%;"
                        >
                            <a
                                href="showcase/"
                                style="
              padding:2rem 1.5rem; border:2px solid #e0e4f0; border-radius:16px;
              text-decoration:none; color:inherit; transition:all 0.2s;
              display:flex; flex-direction:column; align-items:center; gap:0.75rem;
            "
                                onmouseover="this.style.borderColor='#646cff';this.style.boxShadow='0 4px 20px rgba(100,108,255,0.15)'"
                                onmouseout="this.style.borderColor='#e0e4f0';this.style.boxShadow='none'"
                            >
                                <div style="font-size:3rem;">🎨</div>
                                <strong style="font-size:1.1rem;"
                                    >Component Showcase</strong
                                >
                                <span style="font-size:0.82rem;color:#888;"
                                    >Browse all 107 components by category with
                                    live demos</span
                                >
                            </a>

                            <a
                                href="vibe-ai/"
                                style="
              padding:2rem 1.5rem; border:2px solid #e0e4f0; border-radius:16px;
              text-decoration:none; color:inherit; transition:all 0.2s;
              display:flex; flex-direction:column; align-items:center; gap:0.75rem;
            "
                                onmouseover="this.style.borderColor='#646cff';this.style.boxShadow='0 4px 20px rgba(100,108,255,0.15)'"
                                onmouseout="this.style.borderColor='#e0e4f0';this.style.boxShadow='none'"
                            >
                                <div style="font-size:3rem;">🤖</div>
                                <strong style="font-size:1.1rem;"
                                    >Vibe AI Examples</strong
                                >
                                <span style="font-size:0.82rem;color:#888;"
                                    >Intent → UI breakthrough: describe,
                                    generate, materialize</span
                                >
                            </a>

                            <a
                                href="ifs-demo/"
                                style="padding:2rem 1.5rem;border:2px solid #e0e4f0;border-radius:16px;text-decoration:none;color:inherit;transition:all 0.2s;display:flex;flex-direction:column;align-items:center;gap:0.75rem;"
                                onmouseover="this.style.borderColor='#646cff';this.style.boxShadow='0 4px 20px rgba(100,108,255,0.15)'"
                                onmouseout="this.style.borderColor='#e0e4f0';this.style.boxShadow='none'"
                            >
                                <div style="font-size:3rem;">🌊</div>
                                <strong style="font-size:1.1rem;"
                                    >IFS Demo</strong
                                >
                                <span style="font-size:0.82rem;color:#888;"
                                    >Generative HyperGraphs — seed → iterate →
                                    converge</span
                                >
                            </a>

                            <a
                                href="charts-demo/"
                                style="padding:2rem 1.5rem;border:2px solid #e0e4f0;border-radius:16px;text-decoration:none;color:inherit;transition:all 0.2s;display:flex;flex-direction:column;align-items:center;gap:0.75rem;"
                                onmouseover="this.style.borderColor='#646cff';this.style.boxShadow='0 4px 20px rgba(100,108,255,0.15)'"
                                onmouseout="this.style.borderColor='#e0e4f0';this.style.boxShadow='none'"
                            >
                                <div style="font-size:3rem;">📊</div>
                                <strong style="font-size:1.1rem;"
                                    >Chart Showcase</strong
                                >
                                <span style="font-size:0.82rem;color:#888;"
                                    >19 chart types for dashboards — line, bar,
                                    pie, radar, sankey, and more</span
                                >
                            </a>

                            <a
                                href="dashboard-demo/"
                                style="padding:2rem 1.5rem;border:2px solid #e0e4f0;border-radius:16px;text-decoration:none;color:inherit;transition:all 0.2s;display:flex;flex-direction:column;align-items:center;gap:0.75rem;"
                                onmouseover="this.style.borderColor='#646cff';this.style.boxShadow='0 4px 20px rgba(100,108,255,0.15)'"
                                onmouseout="this.style.borderColor='#e0e4f0';this.style.boxShadow='none'"
                            >
                                <div style="font-size:3rem;">📋</div>
                                <strong style="font-size:1.1rem;"
                                    >Dashboard Demo</strong
                                >
                                <span style="font-size:0.82rem;color:#888;"
                                    >Analytics dashboard with KPIs, charts, and
                                    data viz</span
                                >
                            </a>
                        </div>

                        <div
                            style="margin-top:2.5rem;display:flex;gap:1.5rem;font-size:0.78rem;color:#aaa;"
                        >
                            <span>107 components</span><span>·</span>
                            <span>10 categories</span><span>·</span>
                            <span>19 charts</span><span>·</span>
                            <span>AI-native</span><span>·</span>
                            <span>HyperGraph</span>
                        </div>
                    </div>
                `,
            });

            Landing.mount(document.getElementById("app"));
        </script>
    </body>
</html>
